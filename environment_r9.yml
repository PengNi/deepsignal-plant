name: deepsignalpenv-r9
# R9.4.1 workflow: FAST5 + Guppy basecalling + Tombo re-squiggling
# Does NOT include pod5 / pysam (R10-only packages).
#
# Usage:
#   conda env create -f environment_r9.yml
#   conda activate deepsignalpenv-r9
channels:
  - bioconda
  - pytorch
  - conda-forge
dependencies:
  - python>=3.8,<3.12
  - pip
  - cudatoolkit=10.2          # compatible with pytorch 1.7.0–1.11.0
  - numpy>=1.19.2,<1.23       # tombo requires <1.20; scipy 1.7.x requires <1.23
                               # NEVER install streamlit into this env — it can pull numpy>=2
  - h5py>=2.8.0,<3            # h5py 3.x dropped Python-object arrays used by tombo
  - statsmodels>=0.13.2,<0.15
  - scikit-learn>=1.0.2,<1.3
  - pytorch::pytorch=1.11.0
  - scipy>=1.7.3,<1.11        # scipy 1.11 dropped numpy<1.23 support
  - pandas>=1.3.0,<2.0
  - samtools>=1.12
  - minimap2>=2.23
  - deepsignal-plant>=0.1.6
  - pip:
    - ont-tombo==1.5.1         # conda install causes conflicts with newer h5py/numpy
    - ont-fast5-api             # required for multi_to_single_fast5 and FAST5 I/O
